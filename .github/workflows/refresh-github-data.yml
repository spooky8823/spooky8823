name: Refresh portfolio GitHub data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-github-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-portfolio-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public GitHub data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USER: spooky8823
        run: |
          mkdir -p data
          node <<'NODE'
          const fs = require("node:fs");

          const owner = process.env.GITHUB_USER;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "spooky8823-portfolio-data-refresh"
          };

          async function api(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) {
              const detail = await response.text();
              throw new Error(`GitHub API ${response.status} for ${path}: ${detail.slice(0, 300)}`);
            }
            return response.json();
          }

          async function paginated(path) {
            const all = [];
            for (let page = 1; page <= 10; page++) {
              const separator = path.includes("?") ? "&" : "?";
              const batch = await api(`${path}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(batch) || batch.length === 0) break;
              all.push(...batch);
              if (batch.length < 100) break;
            }
            return all;
          }

          async function mapLimit(items, limit, task) {
            const results = new Array(items.length);
            let next = 0;
            async function worker() {
              while (true) {
                const index = next++;
                if (index >= items.length) return;
                results[index] = await task(items[index]);
              }
            }
            await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
            return results;
          }

          (async () => {
            const since = new Date();
            since.setUTCDate(since.getUTCDate() - 366);
            const sinceISO = since.toISOString();
            const untilISO = new Date().toISOString();

            const repos = await paginated(`/users/${owner}/repos?type=owner&sort=pushed`);
            const publicRepos = repos
              .filter((repo) => !repo.private && !repo.fork && !repo.archived)
              .sort((a, b) => new Date(b.pushed_at || 0) - new Date(a.pushed_at || 0));

            const featured = publicRepos.slice(0, 8);
            const repositoryData = await mapLimit(featured, 4, async (repo) => {
              let languages = {};
              try {
                languages = await api(`/repos/${owner}/${encodeURIComponent(repo.name)}/languages`);
              } catch (error) {
                console.warn(`Could not load languages for ${repo.name}:`, error.message);
              }
              return { repo, languages };
            });

            let events = [];
            try {
              events = await paginated(`/users/${owner}/events/public`);
            } catch (error) {
              console.warn("Public events feed unavailable:", error.message);
            }

            // Fetch commit history from every owned public repository. This is
            // what makes date selection useful beyond GitHub's short events feed.
            const commitLists = await mapLimit(publicRepos, 5, async (repo) => {
              try {
                return await paginated(
                  `/repos/${owner}/${encodeURIComponent(repo.name)}/commits?author=${encodeURIComponent(owner)}&since=${encodeURIComponent(sinceISO)}&until=${encodeURIComponent(untilISO)}`
                );
              } catch (error) {
                console.warn(`Could not load commits for ${repo.name}:`, error.message);
                return [];
              }
            });

            const commits = commitLists.flat().map((commit) => ({
              sha: commit.sha,
              message: (commit.commit?.message || "Commit").split("\n")[0],
              date: commit.commit?.committer?.date || commit.commit?.author?.date || null,
              url: commit.html_url,
              repo: commit.__repo || ""
            })).filter((commit) => commit.date)
              .sort((a, b) => new Date(b.date) - new Date(a.date));

            const snapshot = {
              generatedAt: new Date().toISOString(),
              rangeStart: since.toISOString().slice(0, 10),
              rangeEnd: untilISO.slice(0, 10),
              repositories: repositoryData,
              events,
              commits
            };

            fs.writeFileSync("data/github-data.json", JSON.stringify(snapshot, null, 2) + "\n");
            console.log(`Saved ${repositoryData.length} repository summaries and ${commits.length} commits.`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-data.json
          if git diff --cached --quiet; then
            echo "No portfolio data changes."
          else
            git commit -m "chore: refresh portfolio GitHub data"
            git push
          fi
